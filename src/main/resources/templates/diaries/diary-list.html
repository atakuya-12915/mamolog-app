<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>まもログ | 日記一覧</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="/css/styles.css">
</head>

<body>
	<div class="container my-4">

		<div class="d-flex justify-content-between align-items-center mb-3">
			<h2>日記一覧</h2>
			<a href="/diaries/new" class="btn btn-primary">＋ 新規作成</a>
		</div>

		<div class="row row-cols-1 row-cols-md-2 g-3">
			<div class="col" th:each="diary : ${diaryPage.content}">
				<div class="card h-100 shadow-sm">
					<div class="card-body">
						<h5 class="card-title" th:text="${diary.content}">日記本文</h5>
						<p class="text-muted mb-1">
							<small th:text="${#temporals.format(diary.diaryDate, 'yyyy-MM-dd')}">yyyy-MM-dd</small>
						</p>
						<a th:href="@{/diaries/{id}/edit(id=${diary.id})}"
							class="btn btn-sm btn-outline-secondary">編集</a>
					</div>
				</div>
			</div>
		</div>

		<!-- ページング -->
		<nav class="mt-4" th:if="${diaryPage.totalPages > 1}">
			<ul class="pagination justify-content-center">
				<li class="page-item" th:classappend="${diaryPage.first} ? 'disabled'">
					<a class="page-link" th:href="@{/diaries(page=${diaryPage.number - 1})}">&laquo; 前へ</a>
				</li>
				<li class="page-item" th:each="i : ${#numbers.sequence(0, diaryPage.totalPages - 1)}"
					th:classappend="${i == diaryPage.number} ? 'active'">
					<a class="page-link" th:href="@{/diaries(page=${i})}" th:text="${i + 1}">1</a>
				</li>
				<li class="page-item" th:classappend="${diaryPage.last} ? 'disabled'">
					<a class="page-link" th:href="@{/diaries(page=${diaryPage.number + 1})}">次へ &raquo;</a>
				</li>
			</ul>
		</nav>

		<div class="mt-3">
			<a href="/home" class="btn btn-outline-secondary">Homeに戻る</a>
		</div>

	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
