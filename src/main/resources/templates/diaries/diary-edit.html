<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>まもログ | 日記編集</title>
<link rel="stylesheet" href="/css/styles.css" th:href="@{/css/styles.css}" />
</head>

<body>
<div class="app-shell">
	<!-- ヘッダー -->
	<div th:replace="~{fragment :: header}"></div>
	
	<main class="main-area">
		<div class="form-container">
			<h2>日記<span class="edit-title">編集</span></h2>

			<form th:action="@{'/diaries/' + ${diary.id} + '/update'}" 
			      method="post" 
			      enctype="multipart/form-data">

				<!-- 日付 -->
				<div class="form-group">
					<label>日付：</label>
					<input type="date" 
					       name="diaryDate" 
					       th:value="${diary.diaryDate}" 
					       required />
				</div>

				<!-- 本文 -->
				<div class="form-group">
					<label>本文：</label>
					<textarea name="content" 
					          rows="8" 
					          th:text="${diary.content}" 
					          placeholder="今日の日記..."
					          required></textarea>
				</div>

				<!-- 既存写真 -->
				<div class="form-group" th:if="${diary.photoFilename != null}">
					<label>現在の写真：</label>
					<div class="current-photo-wrapper">
						<img th:src="@{'/uploads/' + ${diary.photoFilename}}" 
						     class="photo-preview" 
						     alt="現在の写真" />
						<label class="checkbox-label">
							<input type="checkbox" name="removePhoto" /> 
							<span>写真を削除する</span>
						</label>
					</div>
				</div>

				<!-- 新しい写真 -->
				<div class="form-group">
					<label>新しい写真に差し替え：</label>
					<input type="file" 
					       name="photoFile" 
					       accept="image/*" 
					       id="photoInput" 
					       class="file-input" />
					<img id="newPhotoPreview" 
					     src="#" 
					     alt="プレビュー画像" 
					     class="photo-preview" 
					     style="display:none;" />
				</div>

				<!-- タグ（任意で追加可能） -->
				<div class="form-group">
					<label>タグ：</label>
					<div class="tag-section">
						<button type="button" class="tag-btn">家事</button>
						<button type="button" class="tag-btn">育児</button>
						<button type="button" class="tag-btn">買い物</button>
						<button type="button" class="tag-btn">趣味</button>
					</div>
				</div>

				<!-- アクションボタン -->
				<div class="form-actions">
					<button type="submit" class="btn btn-primary">更新</button>
					<a th:href="@{/diaries}" class="btn btn-secondary">一覧へ戻る</a>
				</div>
			</form>

			<!-- 削除ボタン -->
			<form th:action="@{'/diaries/' + ${diary.id} + '/delete'}" 
			      method="post"
			      onsubmit="return confirm('本当に削除しますか？');" 
			      class="delete-form">
				<button type="submit" class="btn btn-danger">削除</button>
			</form>
		</div>
	</main>
	
	<!-- フッター -->
	<div th:replace="~{fragment :: footer}"></div>
</div>

<script>
// 新しい写真プレビュー
const photoInput = document.getElementById('photoInput');
const newPhotoPreview = document.getElementById('newPhotoPreview');

if (photoInput && newPhotoPreview) {
	photoInput.addEventListener('change', function() {
		const file = this.files[0];
		if (file) {
			const reader = new FileReader();
			reader.onload = function(e) {
				newPhotoPreview.src = e.target.result;
				newPhotoPreview.style.display = 'block';
			}
			reader.readAsDataURL(file);
		} else {
			newPhotoPreview.src = '#';
			newPhotoPreview.style.display = 'none';
		}
	});
}

// タグ選択
const tagButtons = document.querySelectorAll('.tag-btn');
tagButtons.forEach(btn => {
	btn.addEventListener('click', function() {
		btn.classList.toggle('active');
	});
});
</script>

<!-- 共通スクリプト -->
<div th:replace="~{fragment :: scripts}"></div>
</body>
</html>
