<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<link rel="stylesheet" href="/css/styles.css" th:href="@{/css/styles.css}">
	<title>まもログ | Home</title>
</head>

<body>
	<div class="app-shell">
		<!-- ヘッダー -->
		<div th:replace="~{fragment :: header}"></div>

		<!-- メインエリア -->
		<main class="main-area">
			
			<!-- =========================
			     検索フォーム / 新規作成
			     ========================= -->
			<section class="controls">
				<form th:action="@{/}" method="get" class="search-form">
					<input id="searchInput" 
					       type="search" 
					       name="keyword" 
					       placeholder="キーワードで検索" 
					       th:value="${keyword}">
					<button type="submit" class="btn btn-search">検索</button>
				</form>
				<a th:href="@{/todos/new}" class="btn btn-create">＋ 新規作成</a>
			</section>

			<!-- =========================
			     並び替え / 日付指定（修正③）
			     ========================= -->
			<section class="sort-options">
				<div class="sort-links">
					<span class="sort-label">並び替え:</span>
					<a th:href="@{/todos(sortBy='account')}"
					   th:classappend="${sortBy == 'account'} ? ' active'" 
					   class="sort-link">担当者順</a>
					<span class="sort-separator">|</span>
					<a th:href="@{/todos(sortBy='category')}"
					   th:classappend="${sortBy == 'category'} ? ' active'" 
					   class="sort-link">カテゴリ順</a>
					<span class="sort-separator">|</span>
					<a th:href="@{/todos(sortBy='dueDate')}"
					   th:classappend="${sortBy == 'dueDate'} ? ' active'" 
					   class="sort-link">日付順</a>
				</div>
				
				<form th:action="@{/todos}" method="get" class="date-filter">
					<input type="date" name="date" th:value="${date}" class="date-input">
					<button type="submit" class="btn btn-date">日付表示</button>
				</form>
			</section>
			</section>

			<!-- =========================
			     未完了タスク一覧（修正②）
			     ========================= -->
			<section id="tab-content">
				<div id="todo" class="tab-pane active">

					<!-- ヘッダー：未完了件数 -->
					<section class="todo-header">
						<h1>やること</h1>
						<div class="remaining">
							残り：<span id="pending-count" 
							           th:text="${todoPage != null ? todoPage.totalElements : 0}">0</span> 件
						</div>
					</section>

					<!-- 未完了リスト -->
					<section class="todo-list vertical" id="pending-list">
						<li th:each="todo : ${todoPage.content}" 
						    class="todo-card" 
						    th:attr="data-id=${todo.id}">

							<div class="todo-main">
								<!-- チェックボックス -->
								<label class="chk">
									<input type="checkbox" 
									       class="todo-checkbox" 
									       th:attr="data-id=${todo.id}" />
									<span class="fakebox"></span>
								</label>

								<!-- タスク内容 -->
								<div class="todo-body">
									<div class="todo-title">
										<span th:text="${todo.title}">タイトル</span>
										<span class="assignee" 
										      th:if="${todo.account != null}"
										      th:text="${todo.account}"
										      th:classappend="${todo.account == 'ぱぱ'} ? ' papa' : ' mama'">
										</span>
									</div>

									<div class="todo-meta" 
									     th:if="${todo.memo != null and !#strings.isEmpty(todo.memo)}" 
									     th:text="${todo.memo}">メモ</div>

									<div class="todo-meta" th:if="${todo.category != null}">
										カテゴリ: <span th:text="${todo.category.name}">カテゴリ名</span>
									</div>

									<div class="todo-meta" th:if="${todo.dueDate != null}">
										期限:
										<span th:text="${#temporals.format(todo.dueDate, 'yyyy-MM-dd')}">yyyy-MM-dd</span>
										<span th:if="${todo.dueTime != null}" 
										      th:text="${#temporals.format(todo.dueTime, 'HH:mm')}">HH:mm</span>
									</div>
								</div>
							</div>

							<!-- 編集リンク -->
							<div class="todo-actions">
								<a th:href="@{/todos/{id}/edit(id=${todo.id})}" class="edit-link">編集</a>
							</div>
						</li>
					</section>

					<!-- ページネーション -->
					<div class="pagination" th:if="${todoPage.totalPages > 1}">
						<a th:href="@{/(page=0)}" 
						   th:classappend="${todoPage.number == 0} ? 'disabled'">&laquo; 最初</a>
						
						<a th:href="@{/(page=${todoPage.number - 1})}" 
						   th:classappend="${todoPage.number == 0} ? 'disabled'">&lt; 前へ</a>
						
						<span th:each="i : ${#numbers.sequence(0, todoPage.totalPages - 1)}">
							<a th:href="@{/(page=${i})}" 
							   th:text="${i + 1}"
							   th:classappend="${i == todoPage.number} ? 'active'">1</a>
						</span>
						
						<a th:href="@{/(page=${todoPage.number + 1})}" 
						   th:classappend="${todoPage.number + 1 >= todoPage.totalPages} ? 'disabled'">次へ &gt;</a>
						
						<a th:href="@{/(page=${todoPage.totalPages - 1})}" 
						   th:classappend="${todoPage.number + 1 >= todoPage.totalPages} ? 'disabled'">最後 &raquo;</a>
					</div>
				</div>
			</section>

			<!-- =========================
			     最新の日記を表示（修正④）
			     ========================= -->
			<section class="yesterday-diary" th:if="${latestDiary != null}">
				<h3>最新の日記（<span th:text="${#temporals.format(latestDiary.diaryDate, 'yyyy年MM月dd日')}"></span>）</h3>
				<div class="diary-preview">
					<div class="diary-preview-content">
						<p th:text="${#strings.abbreviate(latestDiary.content, 150)}"></p>
					</div>
					<div class="diary-image" th:if="${latestDiary.photoFilename != null}">
						<img th:src="@{'/uploads/' + ${latestDiary.photoFilename}}" 
						     alt="日記の写真" />
					</div>
					<a th:href="@{'/diaries/' + ${latestDiary.id}}" class="btn-view-diary">詳細を見る</a>
				</div>
			</section>

		</main>

		<!-- フッター -->
		<div th:replace="~{fragment :: footer}"></div>
	</div>

	<!-- スクリプト -->
	<div th:replace="~{fragment :: scripts}"></div>
</body>

</html>
