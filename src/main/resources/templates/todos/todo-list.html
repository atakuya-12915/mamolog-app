<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<link rel="stylesheet" href="/css/styles.css" th:href="@{/css/styles.css}">
	<title>まもログ | Todo一覧</title>
</head>

<body>
	<div class="app-shell">
		<!-- ヘッダー -->
		<div th:replace="~{fragment :: header}"></div>

		<!-- メインエリア -->
		<main class="main-area">
			
			<!-- =========================
			     検索フォーム / 新規作成
			     ========================= -->
			<section class="controls">
				<form th:action="@{/todos}" method="get" class="search-form">
					<input id="searchInput" 
					       type="search" 
					       name="keyword" 
					       placeholder="キーワードで検索" 
					       th:value="${keyword}">
					<button type="submit" class="btn btn-search">検索</button>
				</form>
				<a th:href="@{/todos/new}" class="btn btn-create">＋ 新規作成</a>
			</section>

			<!-- =========================
			     並び替え / 日付指定
			     ========================= -->
			<section class="sort-options">
				<div class="sort-links">
					<span class="sort-label">並び替え:</span>
					<a th:href="@{/todos(sortBy='account')}"
					   th:classappend="${sortBy == 'account'} ? ' active'" 
					   class="sort-link">担当者順</a>
					<span class="sort-separator">|</span>
					<a th:href="@{/todos(sortBy='category')}"
					   th:classappend="${sortBy == 'category'} ? ' active'" 
					   class="sort-link">カテゴリ順</a>
					<span class="sort-separator">|</span>
					<a th:href="@{/todos(sortBy='dueDate')}"
					   th:classappend="${sortBy == 'dueDate'} ? ' active'" 
					   class="sort-link">日付順</a>
				</div>
				
				<form th:action="@{/todos}" method="get" class="date-filter">
					<input type="date" name="date" th:value="${date}" class="date-input">
					<button type="submit" class="btn btn-date">日付表示</button>
				</form>
			</section>

			<!-- =========================
			     タブ切替（未完了/完了）
			     ========================= -->
			<section class="tabbar">
				<button class="tab todo-tab active" data-tab="pending-tab">
					未完了 (<span th:text="${incompleteTodos.totalElements}">0</span>)
				</button>
				<button class="tab todo-tab" data-tab="completed-tab">
					完了済 (<span th:text="${completedTodos.totalElements}">0</span>)
				</button>
			</section>

			<!-- =========================
			     未完了タブ
			     ========================= -->
			<section id="pending-tab" class="tab-content">
				<div class="todo-list vertical">
					<li th:each="todo : ${incompleteTodos.content}" 
					    class="todo-card" 
					    th:attr="data-id=${todo.id}">

						<div class="todo-main">
							<label class="chk">
								<input type="checkbox" 
								       class="todo-checkbox" 
								       th:attr="data-id=${todo.id}" />
								<span class="fakebox"></span>
							</label>

							<div class="todo-body">
								<div class="todo-title">
									<span th:text="${todo.title}">タイトル</span>
									<span class="assignee" 
									      th:if="${todo.account != null}"
									      th:text="${todo.account}"
									      th:classappend="${todo.account == 'ぱぱ'} ? ' papa' : ' mama'">
									</span>
								</div>

								<div class="todo-meta" 
								     th:if="${todo.memo != null and !#strings.isEmpty(todo.memo)}" 
								     th:text="${todo.memo}">メモ</div>

								<div class="todo-meta" th:if="${todo.category != null}">
									カテゴリ: <span th:text="${todo.category.name}">カテゴリ名</span>
								</div>

								<div class="todo-meta" th:if="${todo.dueDate != null}">
									期限:
									<span th:text="${#temporals.format(todo.dueDate, 'yyyy-MM-dd')}">yyyy-MM-dd</span>
									<span th:if="${todo.dueTime != null}" 
									      th:text="${#temporals.format(todo.dueTime, 'HH:mm')}">HH:mm</span>
								</div>
							</div>
						</div>

						<div class="todo-actions">
							<a th:href="@{/todos/{id}/edit(id=${todo.id})}" class="edit-link">編集</a>
						</div>
					</li>
				</div>

				<!-- 未完了のページネーション -->
				<div class="pagination" th:if="${incompleteTodos.totalPages > 1}">
					<a th:href="@{/todos(incompletePage=0)}" 
					   th:classappend="${incompleteTodos.number == 0} ? 'disabled'">&laquo; 最初</a>
					
					<a th:href="@{/todos(incompletePage=${incompleteTodos.number - 1})}" 
					   th:classappend="${incompleteTodos.number == 0} ? 'disabled'">&lt; 前へ</a>
					
					<span th:each="i : ${#numbers.sequence(0, incompleteTodos.totalPages - 1)}">
						<a th:href="@{/todos(incompletePage=${i})}" 
						   th:text="${i + 1}"
						   th:classappend="${i == incompleteTodos.number} ? 'active'">1</a>
					</span>
					
					<a th:href="@{/todos(incompletePage=${incompleteTodos.number + 1})}" 
					   th:classappend="${incompleteTodos.number + 1 >= incompleteTodos.totalPages} ? 'disabled'">次へ &gt;</a>
					
					<a th:href="@{/todos(incompletePage=${incompleteTodos.totalPages - 1})}" 
					   th:classappend="${incompleteTodos.number + 1 >= incompleteTodos.totalPages} ? 'disabled'">最後 &raquo;</a>
				</div>
			</section>

			<!-- =========================
			     完了タブ
			     ========================= -->
			<section id="completed-tab" class="tab-content hidden">
				<div class="todo-list vertical">
					<li th:each="todo : ${completedTodos.content}" 
					    class="todo-card done" 
					    th:attr="data-id=${todo.id}">
						
						<div class="todo-main">
							<label class="chk">
								<input type="checkbox" 
								       class="todo-checkbox" 
								       th:attr="data-id=${todo.id}"
								       checked />
								<span class="fakebox"></span>
							</label>
							
							<div class="todo-body">
								<div class="todo-title">
									<span th:text="${todo.title}">タイトル</span>
									<span class="assignee" 
									      th:if="${todo.account != null}"
									      th:text="${todo.account}"
									      th:classappend="${todo.account == 'ぱぱ'} ? ' papa' : ' mama'">
									</span>
								</div>
								
								<div class="todo-meta" 
								     th:if="${todo.memo != null and !#strings.isEmpty(todo.memo)}" 
								     th:text="${todo.memo}">メモ</div>
								
								<div class="todo-meta" th:if="${todo.category != null}">
									カテゴリ: <span th:text="${todo.category.name}">カテゴリ名</span>
								</div>
								
								<div class="todo-meta" th:if="${todo.dueDate != null}">
									期限:
									<span th:text="${#temporals.format(todo.dueDate, 'yyyy-MM-dd')}">yyyy-MM-dd</span>
									<span th:if="${todo.dueTime != null}" 
									      th:text="${#temporals.format(todo.dueTime, 'HH:mm')}">HH:mm</span>
								</div>
							</div>
						</div>
						
						<div class="todo-actions">
							<a th:href="@{/todos/{id}/edit(id=${todo.id})}" class="edit-link">編集</a>
						</div>
					</li>
				</div>

				<!-- 完了のページネーション -->
				<div class="pagination" th:if="${completedTodos.totalPages > 1}">
					<a th:href="@{/todos(completedPage=0)}" 
					   th:classappend="${completedTodos.number == 0} ? 'disabled'">&laquo; 最初</a>
					
					<a th:href="@{/todos(completedPage=${completedTodos.number - 1})}" 
					   th:classappend="${completedTodos.number == 0} ? 'disabled'">&lt; 前へ</a>
					
					<span th:each="i : ${#numbers.sequence(0, completedTodos.totalPages - 1)}">
						<a th:href="@{/todos(completedPage=${i})}" 
						   th:text="${i + 1}"
						   th:classappend="${i == completedTodos.number} ? 'active'">1</a>
					</span>
					
					<a th:href="@{/todos(completedPage=${completedTodos.number + 1})}" 
					   th:classappend="${completedTodos.number + 1 >= completedTodos.totalPages} ? 'disabled'">次へ &gt;</a>
					
					<a th:href="@{/todos(completedPage=${completedTodos.totalPages - 1})}" 
					   th:classappend="${completedTodos.number + 1 >= completedTodos.totalPages} ? 'disabled'">最後 &raquo;</a>
				</div>
			</section>

		</main>

		<!-- フッター -->
		<div th:replace="~{fragment :: footer}"></div>
	</div>

	<!-- スクリプト -->
	<div th:replace="~{fragment :: scripts}"></div>
</body>

</html>
