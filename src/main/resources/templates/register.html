<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="ja">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>まもログ | 新規登録</title>

	<!-- Bootstrap (CDN) -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- 自作スタイル -->
	<link rel="stylesheet" href="/css/styles.css" th:href="@{/css/styles.css}">
</head>

<body>
	<div class="mamolog-wrapper">

		<!-- ヘッダー -->
		<th:block th:replace="~{fragment :: header}"></th:block>

		<!-- メイン -->
		<main class="login-viewport">
			<div class="container">
				<div class="row justify-content-center">
					<div class="col-12 col-sm-10 col-md-8 col-lg-5">
						<div class="card login-card mx-auto">
							<div class="card-body">
								<div class="text-center mb-3">
									<h1 class="h4 mb-0">まもログ</h1>
									<p class="text-muted small mb-2">新規アカウント作成</p>
								</div>

								<!-- 成功メッセージ -->
								<div th:if="${success}" class="alert alert-success small">
									<span th:text="${success}"></span>
								</div>

								<!-- エラーメッセージ -->
								<div th:if="${error}" class="alert alert-danger small">
									<span th:text="${error}"></span>
								</div>

								<form th:action="@{/register}" method="post" novalidate>
									<!-- 表示名 -->
									<div class="form-floating mb-3">
										<input type="text" class="form-control" id="inputName" name="name"
											placeholder="表示名" autocomplete="name" required>
										<label for="inputName">表示名 (例: ぱぱ、まま)</label>
									</div>

									<!-- メールアドレス -->
									<div class="form-floating mb-3">
										<input type="email" class="form-control" id="inputEmail" name="email"
											placeholder="メールアドレス" autocomplete="email" required>
										<label for="inputEmail">メールアドレス</label>
									</div>

									<!-- パスワード -->
									<div class="form-floating mb-3">
										<input type="password" class="form-control" id="inputPassword" name="password"
											placeholder="パスワード" autocomplete="new-password" required>
										<label for="inputPassword">パスワード</label>
										<div class="form-text">8文字以上を推奨します</div>
									</div>

									<!-- 登録ボタン -->
									<div class="d-grid mb-3">
										<button type="submit" class="btn mamolog-btn btn-lg">アカウント作成</button>
									</div>

									<!-- ログインリンク -->
									<div class="text-center">
										<p class="small text-muted mb-0">
											既にアカウントをお持ちですか？
											<a th:href="@{/login}" class="text-decoration-none">ログイン</a>
										</p>
									</div>
								</form>
							</div>
						</div> <!-- /.card -->
					</div>
				</div>
			</div>
		</main>

		<!-- フッター -->
		<th:block th:replace="~{fragment :: footer}"></th:block>
	</div>

	<!-- scripts -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<th:block th:replace="~{fragment :: scripts}"></th:block>
</body>

</html>
