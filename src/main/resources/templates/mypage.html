<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="ja">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>まもログ | マイページ</title>

	<!-- Bootstrap (CDN) -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- 自作スタイル -->
	<link rel="stylesheet" href="/css/styles.css" th:href="@{/css/styles.css}">
</head>

<body>
	<div class="app-shell">

		<!-- ヘッダー -->
		<th:block th:replace="~{fragment :: header}"></th:block>

		<!-- メインエリア -->
		<main class="main-area">
			<div class="container">
				<h2 class="mb-4">マイページ</h2>

				<div class="card" style="max-width: 600px;">
					<div class="card-body">
						<h5 class="card-title mb-3">アカウント情報</h5>
						<table class="table table-borderless">
							<tbody>
								<tr>
									<th style="width: 120px;">表示名</th>
									<td th:text="${user.name}">ぱぱ</td>
								</tr>
								<tr>
									<th>メールアドレス</th>
									<td th:text="${userEmail}">test@example.com</td>
								</tr>
								<tr>
									<th>ロール</th>
									<td th:text="${user.role.name}">USER</td>
								</tr>
								<tr>
									<th>アカウント状態</th>
									<td>
										<span th:if="${user.enabled}" class="badge bg-success">有効</span>
										<span th:unless="${user.enabled}" class="badge bg-secondary">無効</span>
									</td>
								</tr>
							</tbody>
						</table>

						<div class="mt-4">
							<a th:href="@{/home}" class="btn btn-outline-secondary">ホームに戻る</a>
						</div>
					</div>
				</div>
			</div>
		</main>

		<!-- フッター -->
		<th:block th:replace="~{fragment :: footer}"></th:block>
	</div>

	<!-- scripts -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<th:block th:replace="~{fragment :: scripts}"></th:block>
</body>

</html>
