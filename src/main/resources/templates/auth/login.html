<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="ja">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>まもログ | ログイン</title>

	<!-- Bootstrap (CDN) -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- 自作スタイル（Thymeleaf と通常表示両対応） -->
	<link rel="stylesheet" href="/css/styles.css" th:href="@{/css/styles.css}">
</head>

<body>
	<div class="mamolog-wrapper">

		<!-- ヘッダー（存在するなら fragment を読み込む） -->
		<th:block th:replace="~{fragment :: header}"></th:block>

		<!-- メイン（カードを常に画面中央に配置） -->
		<main class="login-viewport">
			<div class="container">
				<div class="row justify-content-center">
					<div class="col-12 col-sm-10 col-md-8 col-lg-5">
						<div class="card login-card mx-auto">
							<div class="card-body">
								<div class="text-center mb-3">
									<h1 class="h4 mb-0">まもログ</h1>
									<p class="text-muted small mb-2">ログインして続行</p><br>
									<p class="text-muted small mb-2">※注意：このサイトはテスト用サイトです</p>
								</div>

								<!-- エラーメッセージ -->
								<div th:if="${param.error}" class="alert alert-danger small">
									メールアドレスまたはパスワードが正しくありません。
								</div>

								<!-- テスト用注意 -->
								<div class="alert alert-warning small mb-3">
									<strong>テスト用ID</strong>：taro.mamolog@example.com<br>
									<strong>パスワード</strong>：password
								</div>

								<form th:action="@{/login}" method="post" novalidate>
									<div class="form-floating mb-3">
										<input type="email" class="form-control" id="inputEmail" name="username"
											placeholder="メールアドレス" autocomplete="email" required>
										<label for="inputEmail">メールアドレス</label>
									</div>

									<div class="form-floating mb-3">
										<input type="password" class="form-control" id="inputPassword" name="password"
											placeholder="パスワード" autocomplete="current-password" required>
										<label for="inputPassword">パスワード</label>
									</div>

									<div class="d-grid mb-2">
										<button type="submit" class="btn mamolog-btn btn-lg">ログイン</button>
									</div>

							</div>
							</form>
						</div>
					</div> <!-- /.card -->
				</div>
			</div>
	</div>
	</main>

	<!-- フッター -->
	<th:block th:replace="~{fragment :: footer}"></th:block>
	</div>

	<!-- scripts: bootstrap 等（必要なら fragment で置き換え） -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<th:block th:replace="~{fragment :: scripts}"></th:block>
</body>

</html>
